<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS Haptic Engineer Studio</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; min-height: 100vh; }
        
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #8e8e93; font-size: 13px; margin-bottom: 25px; text-align: center; }
        
        /* ПАНЕЛ ЗА КОНТРОЛА И СЛАЈДЕРИ */
        .control-panel { width: 100%; max-width: 380px; background: #1c1c1e; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #2c2c2e; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .panel-row { margin-bottom: 20px; }
        .panel-row:last-child { margin-bottom: 0; }
        .label-group { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #a8a8a8; }
        .label-group span b { color: #0095f6; }
        
        /* Стилизирање на слајдерите */
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; background: #2c2c2e; border-radius: 3px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #0095f6; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.4); transition: transform 0.1s; }
        input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.2); }

        /* ГЛАВНО КУТИШТЕ ЗА ТЕСТИРАЊЕ (КОПЧЕ) */
        .test-pad { width: 100%; max-width: 380px; height: 120px; background: linear-gradient(135deg, #1c1c1e, #2c2c2e); border: 2px dashed #0095f6; border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; position: relative; margin-bottom: 20px; transition: border-style 0.2s; }
        .test-pad:active { background: #2c2c2e; }
        .pad-title { font-size: 18px; font-weight: 700; color: #0095f6; }
        .pad-desc { font-size: 12px; color: #8e8e93; margin-top: 4px; }
        
        /* Нативниот сокриен оверлеј слој */
        .haptic-switch-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; z-index: 10; cursor: pointer; }

                /* ИНСТРУМЕНТ ЗА МЕРЕЊЕ И ДИЈАГНОСТИКА */
        .stats-box { width: 100%; max-width: 380px; background: #121212; border-radius: 12px; padding: 12px 15px; border: 1px solid #1c1c1c; display: flex; justify-content: space-between; font-family: monospace; font-size: 12px; color: #8e8e93; }
        .stats-box span b { color: #34c759; }
    </style>
</head>
<body>

    <h1>Haptic Lab Engine</h1>
    <div class="subtitle">Креирај и калибрирај сопствени системски вибрации</div>

    <!-- ТВОЈОТ КОНТРОЛЕН ПАНЕЛ ОД КАДЕ ШТО МЕНУВАШ -->
    <div class="control-panel">
        <!-- Слајдер 1: Број на импулси -->
        <div class="panel-row">
            <div class="label-group">
                <span>Број на импулси (Pulses)</span>
                <span><b id="lbl-pulses">3</b> пати</span>
            </div>
            <input type="range" id="input-pulses" min="1" max="6" value="3" oninput="updateLiveSettings()">
        </div>

        <!-- Слајдер 2: Интервал помеѓу нив -->
        <div class="panel-row">
            <div class="label-group">
                <span>Растојание / Микро-пауза</span>
                <span><b id="lbl-interval">25</b> ms</span>
            </div>
            <input type="range" id="input-interval" min="10" max="150" value="25" oninput="updateLiveSettings()">
        </div>

        <!-- Слајдер 3: Сила -->
        <div class="panel-row">
            <div class="label-group">
                <span>Пресметан Интензитет</span>
                <span><b id="lbl-amplitude">85</b> %</span>
            </div>
            <input type="range" id="input-amplitude" min="10" max="100" value="85" oninput="updateLiveSettings()">
        </div>
    </div>

    <!-- ГОЛЕМОТО СКУШТЕ КАДЕ ШТО КЛИКАШ И ТЕСТИРАШ ОДЗИВ -->
    <div class="test-pad">
        <span class="pad-title">ПРИТИСНИ ТУКА</span>
        <span class="pad-desc">Направи допир за да го осетиш твојот патерн</span>
        
        <!-- Нативниот оверлеј кој го тригерува Taptic Engine со твојот реална допир -->
        <input type="checkbox" switch class="haptic-switch-overlay" id="custom-haptic-trigger">
    </div>

    <!-- ДИЈАГНОСТИКА -->
    <div class="stats-box">
        <span>ТАКТ: <b id="stat-pulses">3 ПУЛСА</b></span>
        <span>ИНТЕРВАЛ: <b id="stat-ms">25ms</b></span>
        <span>ОДЗИВ: <b id="stat-latency">0.0ms</b></span>
    </div>

    <script>
        const triggerOverlay = document.getElementById('custom-haptic-trigger');

        // Читање и ажурирање на вредностите во реално време на екранот
        function updateLiveSettings() {
            const pulses = document.getElementById('input-pulses').value;
            const interval = document.getElementById('input-interval').value;
            const amplitude = document.getElementById('input-amplitude').value;

            document.getElementById('lbl-pulses').innerText = pulses;
            document.getElementById('lbl-interval').innerText = interval;
            document.getElementById('lbl-amplitude').innerText = amplitude;

            document.getElementById('stat-pulses').innerText = pulses + ' ПУЛСА';
            document.getElementById('stat-ms').innerText = interval + 'ms';
        }

        // Помошен извршител кој испраќа поединечни импулси кон Taptic Engine во одредени милисекунди
        function dispatchEnginePulse(ms) {
            const wrapper = document.createElement('div');
            const uniqueId = 'lab-gate-' + Math.random().toString(36).substring(2);
            wrapper.innerHTML = `<input type="checkbox" id="${uniqueId}" switch><label for="${uniqueId}"></label>`;
            wrapper.setAttribute("style", "position:fixed; opacity:0; pointer-events:none; top:0; left:0;");
            document.body.appendChild(wrapper);
            const actionNode = wrapper.querySelector('label');
            
            setTimeout(() => { actionNode.click(); }, ms);
            setTimeout(() => { wrapper.remove(); }, ms + 150);
        }

        // ГЛАВЕН ИНЖЕНЕРСКИ МЕХАНИЗАМ ЗА СИМУЛАЦИЈА НА ДОПИР
        triggerOverlay.addEventListener('click', () => {
            const startPerf = performance.now();
            
            // Ги земаме тековните вредности директно од твоите слајдери
            const totalPulses = parseInt(document.getElementById('input-pulses').value);
            const intervalMs = parseInt(document.getElementById('input-interval').value);

            // Креирање на сопствена хаптичка композиција врз основа на твоите математички вредности
            // Првиот пулс оди автоматски од самиот физички клик, наредните се темпираат математички
            for (let i = 1; i < totalPulses; i++) {
                dispatchEnginePulse(i * intervalMs);
            }

            // Мерење на брзината со која хардверот го обработи твојот код
            requestAnimationFrame(() => {
                const endPerf = performance.now();
                document.getElementById('stat-latency').innerText = (endPerf - startPerf).toFixed(1) + 'ms';
            });
        });

        document.addEventListener('gesturestart', e => e.preventDefault());
    </style>
</body>
</html>
