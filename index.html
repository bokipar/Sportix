<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS Haptic Click Lab</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; min-height: 100vh; }
        
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #8e8e93; font-size: 13px; margin-bottom: 25px; text-align: center; }
        
        .control-panel { width: 100%; max-width: 380px; background: #1c1c1e; border-radius: 16px; padding: 20px; margin-bottom: 25px; border: 1px solid #2c2c2e; }
        .label-group { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #a8a8a8; }
        .label-group span b { color: #34c759; }
        
        /* ПОПРАВКА НА СЛАЈДЕРОТ: Овозможува непречено влечење на iOS */
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 8px; background: #2c2c2e; border-radius: 4px; outline: none; touch-action: pan-x !important; pointer-events: auto !important; margin-bottom: 15px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: #34c759; border-radius: 50%; cursor: pointer; pointer-events: auto !important; }

        /* МРЕЖА СО БРЗИ КОПЧИЊА ЗА ИЗБОР АКО СЛАЈДЕРОТ КОЧИ */
        .selector-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; width: 100%; margin-top: 5px; }
        .selector-num { background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 8px; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; transition: background 0.1s; pointer-events: auto !important; }
        .selector-num.active { background: #34c759; border-color: #34c759; color: #000; }

        /* ТЕСТ ПОДРАЧЈЕ ЗА SWIPE ГЕСТИКУЛАЦИЈА */
        .swipe-zone { width: 100%; max-width: 380px; height: 100px; background: #1c1c1e; border: 2px dashed #34c759; border-radius: 16px; display: flex; justify-content: space-around; align-items: center; padding: 0 15px; position: relative; overflow: hidden; margin-bottom: 20px; pointer-events: auto !important; }
        .swipe-instruction { position: absolute; font-size: 14px; color: #8e8e93; font-weight: 600; pointer-events: none; text-align: center; width: 100%; top: 38%; }
        
        .real-switch { width: 45px; height: 45px; opacity: 0; z-index: 5; cursor: pointer; -webkit-appearance: none; pointer-events: auto !important; }
    </style>
</head>
<body>

    <h1>Haptic Swipe Engine</h1>
    <div class="subtitle">Калибрирање преку реални физички импулси</div>

    <div class="control-panel">
        <div class="label-group">
            <span>Избери број на импулси:</span>
            <span><b id="lbl-count">4</b> вибрации</span>
        </div>
        
        <!-- Оптимизиран слајдер -->
        <input type="range" id="input-count" min="1" max="6" value="4" oninput="changeBySlider(this.value)">
        
        <!-- Системски копчиња како резерва -->
        <div class="selector-grid">
            <div class="selector-num" onclick="changeByBtn(1)">1</div>
            <div class="selector-num" onclick="changeByBtn(2)">2</div>
            <div class="selector-num" onclick="changeByBtn(3)">3</div>
            <div class="selector-num" class="selector-num active" onclick="changeByBtn(4)" id="btn-default">4</div>
            <div class="selector-num" onclick="changeByBtn(5)">5</div>
            <div class="selector-num" onclick="changeByBtn(6)">6</div>
        </div>
    </div>

    <div class="swipe-zone" id="pad-zone">
        <div class="swipe-instruction" id="ins-text">Повлечи брзо со прст овде ➔</div>
    </div>

        <div style="font-family: monospace; font-size: 12px; color: #8e8e93; text-align: center; width: 100%; max-width: 380px;">
        СТАТУС: <b style="color: #34c759;">СЕНЗОРИТЕ СЕ ОДБЛОКИРАНИ</b><br>
        <span style="font-size: 10px; color: #555; display: block; margin-top: 5px;">Ако слајдерот кочи, кликни директно на некоја од бројките.</span>
    </div>

    <script>
        // Функција за промена на вредноста преку слајдерот
        function changeBySlider(val) {
            updateInterface(parseInt(val));
        }

        // Функција за промена на вредноста преку копчињата со бројки
        function changeByBtn(val) {
            document.getElementById('input-count').value = val;
            updateInterface(val);
        }

        // Централна логика за цртање на прекинувачите на екранот
        function updateInterface(count) {
            document.getElementById('lbl-count').innerText = count;
            
            // Ажурирај ги визуелните стилови на копчињата со бројки
            const btns = document.querySelectorAll('.selector-num');
            btns.forEach((btn, idx) => {
                if (idx + 1 === count) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            const padZone = document.getElementById('pad-zone');
            padZone.innerHTML = `<div class="swipe-instruction" id="ins-text">Повлечи брзо со прст овде ➔</div>`;
            
            // Нацртај ги реалните нативни прекинувачи еден до друг
            for (let i = 0; i < count; i++) {
                const sw = document.createElement('input');
                sw.setAttribute('type', 'checkbox');
                sw.setAttribute('switch', ''); 
                sw.className = 'real-switch';
                
                sw.addEventListener('touchstart', () => {
                    const txt = document.getElementById('ins-text');
                    if(txt) txt.style.opacity = '0';
                });
                
                padZone.appendChild(sw);
            }
        }

        // Почетно стартување на системот со дефолтна вредност 4
        updateInterface(4);

        document.addEventListener('gesturestart', e => e.preventDefault());
    </script>
</body>
</html>
