<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS Ultimate Haptic Laboratory with Live Waveform</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 30px 15px; min-height: 100vh; }
        
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 5px; text-align: center; letter-spacing: -0.5px; }
        .subtitle { color: #8e8e93; font-size: 13px; margin-bottom: 20px; text-align: center; }
        
        /* 1. ГРАФИЧКИ ГЕНЕРАТОР НА БРАНОВИ (WAVEFORM VISUALIZER) */
        .wave-panel { width: 100%; max-width: 380px; background: #121212; border-radius: 14px; padding: 15px; margin-bottom: 15px; border: 1px solid #1c1c1c; }
        .wave-header { font-size: 11px; color: #8e8e93; font-weight: 600; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }
        .wave-canvas { width: 100%; height: 60px; display: flex; align-items: center; justify-content: center; gap: 3px; background: #000; border-radius: 8px; overflow: hidden; padding: 0 10px; }
        .wave-bar { width: 4px; height: 4px; background: #34c759; border-radius: 2px; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* ЦЕНТРАЛЕН КОНТРОЛЕН ПАНЕЛ */
        .control-panel { width: 100%; max-width: 380px; background: #1c1c1e; border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid #2c2c2e; }
        .panel-section { margin-bottom: 18px; }
        .panel-section:last-child { margin-bottom: 0; }
        
        .label-group { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 600; margin-bottom: 8px; color: #a8a8a8; }
        .label-group span b { color: #34c759; }
        
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; background: #2c2c2e; border-radius: 3px; outline: none; touch-action: pan-x !important; pointer-events: auto !important; margin-bottom: 10px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #34c759; border-radius: 50%; cursor: pointer; pointer-events: auto !important; }

        .selector-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; width: 100%; }
        .selector-num { background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 8px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #fff; cursor: pointer; pointer-events: auto !important; }
        .selector-num.active { background: #34c759; border-color: #34c759; color: #000; }

        /* ЗОНА ЗА ТЕСТИРАЊЕ СО SWIPE */
        .swipe-zone { width: 100%; max-width: 380px; height: 90px; background: #1c1c1e; border: 2px dashed #34c759; border-radius: 16px; display: flex; justify-content: space-around; align-items: center; padding: 0 15px; position: relative; overflow: hidden; margin-bottom: 15px; pointer-events: auto !important; }
        .swipe-instruction { position: absolute; font-size: 13px; color: #8e8e93; font-weight: 600; pointer-events: none; text-align: center; width: 100%; top: 38%; }
        .real-switch { width: 45px; height: 45px; opacity: 0; z-index: 5; cursor: pointer; -webkit-appearance: none; pointer-events: auto !important; }
    </style>
</head>
<body>

    <h1>Haptic Lab Suite v3.0</h1>
    <div class="subtitle">Целосна софтверска модулација и графичка визуелизација</div>

    <!-- ЖИВ ГРАФИЧКИ ГЕНЕРАТОР НА ТАПТИЧКИ БРАНОВИ -->
    <div class="wave-panel">
        <div class="wave-header">Генератор на хаптички бран (Live Waveform)</div>
        <div class="wave-canvas" id="canvas-container"></div>
    </div>

        <!-- ГЛАВЕН ПАНЕЛ ОД КАДЕ ШТО МЕНУВАШ СЀ -->
    <div class="control-panel">
        <div class="panel-section">
            <div class="label-group">
                <span>Број на импулси (Pulses)</span>
                <span><b id="lbl-count">4</b> вибрации</span>
            </div>
            <input type="range" id="input-count" min="1" max="6" value="4" oninput="changeCountBySlider(this.value)">
            <div class="selector-grid">
                <div class="selector-num" onclick="changeCountByBtn(1)">1</div>
                <div class="selector-num" onclick="changeByBtn(2)">2</div>
                <div class="selector-num" onclick="changeCountByBtn(3)">3</div>
                <div class="selector-num selector-num active" onclick="changeCountByBtn(4)">4</div>
                <div class="selector-num" onclick="changeCountByBtn(5)">5</div>
                <div class="selector-num" onclick="changeCountByBtn(6)">6</div>
            </div>
        </div>

        <div class="panel-section">
            <div class="label-group">
                <span>Интервал помеѓу прекини</span>
                <span><b id="lbl-interval">35</b> ms</span>
            </div>
            <input type="range" id="input-interval" min="15" max="120" value="35" oninput="updateInterval(this.value)">
        </div>

        <div class="panel-section">
            <div class="label-group">
                <span>Сила на удар (Amplitude)</span>
                <span><b id="lbl-amplitude">80</b> %</span>
            </div>
            <input type="range" id="input-amplitude" min="20" max="100" value="80" oninput="updateAmplitude(this.value)">
        </div>
    </div>

    <!-- ИНТЕРАКТИВНА ЗОНА ЗА ТЕСТИРАЊЕ СО ПОВЛЕКУВАЊЕ (SWIPE) -->
    <div class="swipe-zone" id="pad-zone">
        <div class="swipe-instruction" id="ins-text">Повлечи со прст од лево на десно ➔</div>
    </div>

    <script>
        // Иницијално цртање на 35 барови во графичкиот генератор
        const canvas = document.getElementById('canvas-container');
        for (let i = 0; i < 35; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-bar';
            canvas.appendChild(bar);
        }
        const waveBars = document.querySelectorAll('.wave-bar');

        function changeCountBySlider(val) { updateHapticInterface(parseInt(val), null, null); }
        function changeCountByBtn(val) { document.getElementById('input-count').value = val; updateHapticInterface(val, null, null); }
        function updateInterval(val) { updateHapticInterface(null, parseInt(val), null); }
        function updateAmplitude(val) { updateHapticInterface(null, null, parseInt(val)); }

        // ЦЕНТРАЛЕН МОДУЛАТОР И ГЕНЕРАТОР НА ИНТЕРФЕЈСОТ
        function updateHapticInterface(count, interval, amplitude) {
            const currentCount = count !== null ? count : parseInt(document.getElementById('input-count').value);
            const currentInterval = interval !== null ? interval : parseInt(document.getElementById('input-interval').value);
            const currentAmplitude = amplitude !== null ? amplitude : parseInt(document.getElementById('input-amplitude').value);

            // Ажурирање на текстуалните лабели
            document.getElementById('lbl-count').innerText = currentCount;
            document.getElementById('lbl-interval').innerText = currentInterval;
            document.getElementById('lbl-amplitude').innerText = currentAmplitude;

            // Смена на активното копче кај бројките
            const btns = document.querySelectorAll('.selector-num');
            btns.forEach((btn, idx) => {
                if (idx + 1 === currentCount) { btn.classList.add('active'); } 
                else { btn.classList.remove('active'); }
            });

            // 1. РЕКОНСТРУКЦИЈА НА ЖИВИОТ ГРАФИК (WAVEFORM VISUALIZATION)
            // Прво ги ресетираме сите барови на почетна нулта точка
            waveBars.forEach(bar => { bar.style.height = '4px'; bar.style.background = '#2c2c2e'; });

            // Математички ги пресметуваме позициите на пиковите на хаптичкиот бран
            // Растојанието помеѓу пиковите зависи директно од одбраниот интервал во ms
            const step = Math.max(1, Math.round(currentInterval / 12)); 
            let assignedPulses = 0;

            for (let i = 2; i < waveBars.length; i += step) {
                if (assignedPulses >= currentCount) break;
                
                // Му даваме на пикот висина соодветно на слајдерот за Amplitude (%)
                const calculatedHeight = (currentAmplitude / 100) * 50;
                waveBars[i].style.height = calculatedHeight + 'px';
                
                // Промена на бојата во зависност од јачината (зелена за меко, црвена за силно)
                if (currentAmplitude > 75) {
                    waveBars[i].style.background = '#ff3b30'; // Остар силен шок
                } else {
                    waveBars[i].style.background = '#34c759'; // Нативен фидбек
                }
                assignedPulses++;
            }

            // 2. РЕКОНСТРУКЦИЈА НА ФИЗИЧКИТЕ ПРЕКИНУВАЧИ ДОЛУ ЗА SWIPE ТЕСТ
            const padZone = document.getElementById('pad-zone');
            padZone.innerHTML = `<div class="swipe-instruction" id="ins-text">Повлечи со прст од лево на десно ➔</div>`;
            
            for (let i = 0; i < currentCount; i++) {
                const sw = document.createElement('input');
                sw.setAttribute('type', 'checkbox');
                sw.setAttribute('switch', ''); 
                sw.className = 'real-switch';
                
                // Физичкото растојание на екранот соодветствува со графичкиот приказ горе
                const spacing = (currentInterval / 120) * 18;
                sw.style.marginLeft = spacing + 'px';
                sw.style.marginRight = spacing + 'px';
                
                sw.addEventListener('touchstart', () => {
                    const txt = document.getElementById('ins-text');
                    if(txt) txt.style.opacity = '0';
                });
                
                padZone.appendChild(sw);
            }
        }

        // Почетно вчитување со дефолт вредности (4 пулса, 35ms, 80% јачина)
        updateHapticInterface(4, 35, 80);

        document.addEventListener('gesturestart', e => e.preventDefault());
    </script>
</body>
</html>
