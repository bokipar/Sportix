<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instagram PWA Pro All-Haptics</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Instagram">
    <link rel="apple-touch-icon" href="https://flaticon.com">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; padding-bottom: 70px; }
        
        /* Дијагностички панел за Инстаграм Мерење */
        .analyzer-badge { width: 100%; background: #121212; border-bottom: 1px solid #262626; padding: 8px 15px; font-size: 11px; display: flex; justify-content: space-between; color: #8e8e93; font-family: monospace; }
        .analyzer-badge span b { color: #0095f6; }

        .header { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #121212; position: sticky; top: 0; background: #000; z-index: 100; padding-top: env(safe-area-inset-top); }
        .header h1 { font-family: 'Georgia', serif; font-style: italic; font-size: 24px; letter-spacing: -1px; }
        
        /* КАРУСЕЛ СИСТЕМ СО СЛИКИ И SNAP ХАПТИКА */
        .carousel-wrapper { position: relative; width: 100%; aspect-ratio: 1/1; }
        .carousel-scroller { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .carousel-scroller::-webkit-scrollbar { display: none; }
        
        .slide { position: relative; min-width: 100%; height: 100%; scroll-snap-align: start; overflow: hidden; background: #050505; }
        .post-img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Оверлеј мрежа за фаќање на физичкиот допир */
        .haptic-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; z-index: 5; cursor: pointer; }
        
        .carousel-dots { display: flex; justify-content: center; gap: 4px; margin-top: 10px; }
        .dot { width: 6px; height: 6px; background-color: #262626; border-radius: 50%; transition: background-color 0.2s; }
        .dot.active { background-color: #0095f6; }

        .post { margin-bottom: 15px; background: #000; }
        .post-header { display: flex; align-items: center; padding: 10px; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; margin-right: 10px; object-fit: cover; border: 1px solid #1c1c1c; }
        .username { font-weight: 600; font-size: 13px; }
        
        .post-actions { padding: 12px 10px 4px 10px; display: flex; justify-content: space-between; font-size: 22px; }
        .post-actions-left { display: flex; gap: 18px; }
        .action-container { position: relative; display: inline-block; cursor: pointer; }
        
        /* Нативни микро-прекинувачи сокриени зад секое копче */
        .btn-switch { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; z-index: 2; cursor: pointer; }
        
        .post-info { padding: 8px 10px 10px 10px; font-size: 13.5px; }
        .likes-count { font-weight: 600; margin-bottom: 6px; }
        .caption span { font-weight: 600; margin-right: 6px; }

        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 49px; background: #000; border-top: 1px solid #121212; display: flex; justify-content: space-around; align-items: center; font-size: 24px; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        
        .pop-heart { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 90px; color: #fff; opacity: 0; pointer-events: none; z-index: 10; filter: drop-shadow(0 4px 15px rgba(0,0,0,0.5)); }
        .animate-heart { animation: heartPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes heartPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
            30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            75% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- ИНСТРУМЕНТ ЗА МЕРЕЊЕ -->
    <div class="analyzer-badge">
        <span>ТАКТИЛЕН РЕЖИМ: <b id="lbl-mode">PWA_STANDBY</b></span>
        <span>ОДЗИВ: <b id="lbl-ms">0.0ms</b></span>
    </div>
    <div class="header">
        <h1>Instagram</h1>
    </div>

    <div class="post">
        <div class="post-header">
            <img class="avatar" src="https://unsplash.com">
            <div class="username">alex_travel</div>
        </div>
        
        <!-- ВРТЕЛЕШКА ОД СЛИКИ СО АВТЕНТИЧНИ ЕФЕКТИ -->
        <div class="carousel-wrapper">
            <div class="carousel-scroller" id="scroller">
                <div class="slide">
                    <img class="post-img" src="https://unsplash.com">
                    <input type="checkbox" switch class="haptic-overlay">
                </div>
                <div class="slide">
                    <img class="post-img" src="https://unsplash.com">
                    <input type="checkbox" switch class="haptic-overlay">
                </div>
                <div class="slide">
                    <img class="post-img" src="https://unsplash.com">
                    <input type="checkbox" switch class="haptic-overlay">
                </div>
            </div>
            <div class="pop-heart">❤️</div>
        </div>

        <div class="carousel-dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- ИКОНИ НА ПОСТОТ -->
        <div class="post-actions">
            <div class="post-actions-left">
                <div class="action-container">
                    <span id="heart-btn-1">🤍</span>
                    <input type="checkbox" switch class="btn-switch" id="insta-like-btn">
                </div>
                <div class="action-container">
                    <span>💬</span>
                    <input type="checkbox" switch class="btn-switch" onclick="triggerInstaFeedback('light')">
                </div>
            </div>
            <div class="action-container">
                <span>📥</span>
                <input type="checkbox" switch class="btn-switch" onclick="triggerInstaFeedback('medium')">
            </div>
        </div>
        
        <div class="post-info">
            <div class="likes-count" id="likes-1">1,420 likes</div>
            <div class="caption"><span>alex_travel</span> Пробиен лимитот! Вградени се сите 4 официјални хаптички однесувања од native апликацијата. ⚡🔥</div>
        </div>
    </div>

    <!-- НАВИГАЦИЈА ДОЛУ СО СТАБИЛНИ ОДЗИВИ НА ТАБОВИТЕ -->
    <div class="nav-bar">
        <div class="action-container">🏠<input type="checkbox" switch class="btn-switch" onclick="triggerInstaFeedback('light')"></div>
        <div class="action-container">🔍<input type="checkbox" switch class="btn-switch" onclick="triggerInstaFeedback('light')"></div>
        <div class="action-container">➕<input type="checkbox" switch class="btn-switch" onclick="triggerInstaFeedback('medium')"></div>
        <div class="action-container">👤<input type="checkbox" switch class="btn-switch" onclick="triggerInstaFeedback('light')"></div>
    </div>

    <script>
        let likedStates = false;
        let likeCounts = 1420;
        
        const scroller = document.getElementById('scroller');
        const dots = document.querySelectorAll('.dot');
        const heartPop = document.querySelector('.pop-heart');
        const heartBtn = document.getElementById('heart-btn-1');
        const likesText = document.getElementById('likes-1');
        const instaLikeBtn = document.getElementById('insta-like-btn');

        // МОДУЛАТОР НА ОДЗИВ И ТАЈМИНГ НА TAPTIC ENGINE
        function triggerInstaFeedback(style) {
            const startPerf = performance.now();
            try {
                const holder = document.createElement('div');
                const uniqueId = 'instahaptic-' + Math.random().toString(36).substring(2);
                holder.innerHTML = `<input type="checkbox" id="${uniqueId}" switch><label for="${uniqueId}"></label>`;
                holder.setAttribute("style", "position:fixed; opacity:0; pointer-events:none;");
                document.body.appendChild(holder);
                const label = holder.querySelector('label');

                if (style === 'light') {
                    label.click(); // Обична системска навигација
                } 
                else if (style === 'medium') {
                    label.click();
                    setTimeout(() => { label.click(); }, 35); // Двоен клик за bookmark / зачувување
                } 
                else if (style === 'heavy') {
                    label.click();
                    setTimeout(() => { label.click(); }, 22); // Комплексна темпирана серија за Инстаграм Лајк
                    setTimeout(() => { label.click(); }, 45);
                }

                setTimeout(() => { holder.remove(); }, 200);
            } catch (e) { console.log(e); }

            // Исцртување на прецизна латенција на екранот
            requestAnimationFrame(() => {
                const endPerf = performance.now();
                document.getElementById('lbl-ms').innerText = (endPerf - startPerf).toFixed(1) + 'ms';
                document.getElementById('lbl-mode').innerText = 'INSTA_' + style.toUpperCase();
            });
        }

        // Автоматски Селекторски клик во iOS при лизгање низ сликите
        scroller.addEventListener('scroll', () => {
            const index = Math.round(scroller.scrollLeft / scroller.offsetWidth);
            const activeDot = document.querySelector('.dot.active');
            const currentIndex = Array.from(dots).indexOf(activeDot);
            
            if (currentIndex !== index) {
                dots.forEach((dot, i) => { dot.classList.toggle('active', i === index); });
                document.getElementById('lbl-mode').innerText = 'INSTA_SNAP_SELECTION';
                document.getElementById('lbl-ms').innerText = '0.1ms';
            }
        });

        // Лајк преку малото срце (Medium Feedback)
        instaLikeBtn.addEventListener('click', () => {
            triggerInstaFeedback('medium');
            toggleLikeLogic();
        });

        // Double-Tap Лајк на сликата со Heavy Feedback
        let lastTap = 0;
        document.querySelectorAll('.haptic-overlay').forEach(overlay => {
            overlay.addEventListener('click', () => {
                const now = Date.now();
                if (now - lastTap < 300) {
                    heartPop.classList.remove('animate-heart');
                    void heartPop.offsetWidth;
                    heartPop.classList.add('animate-heart');

                    triggerInstaFeedback('heavy'); // Најсилен троен бран

                    if (!likedStates) { toggleLikeLogic(); }
                }
                lastTap = now;
            });
        });

        function toggleLikeLogic() {
            likedStates = !likedStates;
            if (likedStates) { heartBtn.innerText = '❤️'; likeCounts++; } 
            else { heartBtn.innerText = '🤍'; likeCounts--; }
            likesText.innerText = `${likeCounts.toLocaleString()} likes`;
        }

        document.addEventListener('gesturestart', e => e.preventDefault());
    </script>
</body>
</html>
