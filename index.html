<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>iOS Haptic Showcase</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 20px;
        }
        .btn-container {
            position: relative;
            width: 280px;
            height: 60px;
            background: #1c1c1e;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #0095f6;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        /* Невидливиот нативен прекинувач кој го тригерува физичкиот Taptic Engine */
        .ios-switch-trigger {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 2;
        }
        select, input[type="date"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            z-index: 2;
        }
    </style>
</head>
<body>

    <h2>iOS Нативна Хаптика</h2>

    <!-- 1. СТАНДАРДЕН СИСТЕМСКИ КЛИК (Преку Switch) -->
    <div class="btn-container">
        1. Стандарден Клик (.light)
        <input type="checkbox" switch class="ios-switch-trigger">
    </div>

    <!-- 2. ДУПЛИ / ПОСИЛЕН УДАР (Преку брза серија на микро-прекинувачи во JS) -->
    <div class="btn-container" id="heavy-btn">
        2. Посилен Удар (.heavy)
    </div>

    <!-- 3. СЕЛЕКТОРСКИ МИКРО-КЛИК (Се активира при промена на опција) -->
    <div class="btn-container">
        3. Селекторски Микро-клик
        <select onchange="this.blur()">
            <option>Опција 1</option>
            <option>Опција 2</option>
            <option>Опција 3</option>
        </select>
    </div>

    <!-- 4. ДАТУМСКИ СЛАТКИ КЛИКОВИ (Вграден iOS систем за тркалање) -->
    <div class="btn-container">
        4. Датумски Скрол Клик
        <input type="date">
    </div>

    <script>
        // Код за симулирање на Посилен / Потежок удар (Heavy Haptic)
        const heavyBtn = document.getElementById('heavy-btn');
        let lastTap = 0;

        heavyBtn.addEventListener('click', () => {
            try {
                // Креираме моментален невидлив switch прекинувач
                const el = document.createElement('div');
                const id = 'h-' + Math.random().toString(36).substring(2);
                el.innerHTML = `<input type="checkbox" id="${id}" switch><label for="${id}"></label>`;
                el.setAttribute("style", "position:fixed; opacity:0; pointer-events:none;");
                document.body.appendChild(el);
                
                const label = el.querySelector('label');
                
                // Три брзи последователни кликови за дел од секунда го тераат Taptic Engine да удри посилно
                label.click();
                setTimeout(() => { label.click(); }, 20);
                setTimeout(() => { label.click(); }, 40);
                
                setTimeout(() => { el.remove(); }, 150);
            } catch (e) { console.log(e); }
        });
    </script>
</body>
</html>
