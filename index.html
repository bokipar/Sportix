<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instagram Advanced Haptics</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Instagram">
    <link rel="apple-touch-icon" href="https://flaticon.com">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow-x: hidden; padding-bottom: 70px; }
        .header { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #121212; position: sticky; top: 0; background: #000; z-index: 100; padding-top: env(safe-area-inset-top); }
        .header h1 { font-family: 'Georgia', serif; font-style: italic; font-size: 24px; letter-spacing: -1px; }
        
        .carousel-wrapper { position: relative; width: 100%; aspect-ratio: 1/1; }
        .carousel-scroller { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .carousel-scroller::-webkit-scrollbar { display: none; }
        .slide { position: relative; min-width: 100%; height: 100%; scroll-snap-align: start; overflow: hidden; background: #050505; }
        .post-img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Главниот невидлив тригер кој ја пресретнува и мери брзината на прстот */
        .haptic-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; z-index: 5; cursor: pointer; }
        
        .post { margin-bottom: 15px; background: #000; }
        .post-header { display: flex; align-items: center; padding: 10px; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; margin-right: 10px; object-fit: cover; border: 1px solid #1c1c1c; }
        .username { font-weight: 600; font-size: 13px; }
        .post-actions { padding: 12px 10px 4px 10px; display: flex; gap: 18px; font-size: 22px; }
        .action-btn { position: relative; display: inline-block; cursor: pointer; }
        
        /* Сокриен switch зад секое навигациско копче */
        .btn-switch { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; z-index: 2; cursor: pointer; }
        
        .post-info { padding: 8px 10px 10px 10px; font-size: 13.5px; }
        .likes-count { font-weight: 600; margin-bottom: 6px; }
        .caption span { font-weight: 600; margin-right: 6px; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 49px; background: #000; border-top: 1px solid #121212; display: flex; justify-content: space-around; align-items: center; font-size: 24px; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        
        .pop-heart { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 90px; color: #fff; opacity: 0; pointer-events: none; z-index: 10; filter: drop-shadow(0 4px 15px rgba(0,0,0,0.5)); }
        .animate-heart { animation: heartPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes heartPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
            30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            75% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Instagram</h1>
    </div>

    <div class="post">
        <div class="post-header">
            <img class="avatar" src="https://unsplash.com">
            <div class="username">alex_travel</div>
        </div>
        <div class="carousel-wrapper">
            <div class="carousel-scroller" id="scroller">
                <div class="slide">
                    <img class="post-img" src="https://unsplash.com">
                    <input type="checkbox" switch class="haptic-overlay">
                </div>
            </div>
            <div class="pop-heart">❤️</div>
        </div>
        <div class="post-actions">
            <div class="action-btn" style="font-size: 22px;">
                <span id="heart-btn-1">🤍</span>
                <input type="checkbox" switch class="btn-switch" id="manual-like-trigger">
            </div>
            <div class="action-btn">
                <span>💬</span>
                <input type="checkbox" switch class="btn-switch" id="comment-trigger">
            </div>
        </div>
        <div class="post-info">
            <div class="likes-count" id="likes-1">1,420 likes</div>
            <div class="caption"><span>alex_travel</span> Пробиен лимитот! Направен е нов систем на темпиран пренос на хаптика. ⚡🔥</div>
        </div>
    </div>

    <!-- ДОЛНА ЛЕНТА: Специфично темпирани табови за различен фидбек -->
    <div class="nav-bar">
        <div class="action-btn">🏠<input type="checkbox" switch class="btn-switch" onclick="executeHapticSystem('light')"></div>
        <div class="action-container action-btn">🔍<input type="checkbox" switch class="btn-switch" onclick="executeHapticSystem('medium')"></div>
        <div class="action-container action-btn">➕<input type="checkbox" switch class="btn-switch" onclick="executeHapticSystem('heavy')"></div>
    </div>

    <script>
        let likedStates = false;
        let likeCounts = 1420;
        
        const scroller = document.getElementById('scroller');
        const heartPop = document.querySelector('.pop-heart');
        const heartBtn = document.getElementById('heart-btn-1');
        const likesText = document.getElementById('likes-1');
        const manualLikeTrigger = document.getElementById('manual-like-trigger');
        const commentTrigger = document.getElementById('comment-trigger');

        // КЛУЧОТ НА ХАКОТ: Прецизна софтверска модулација во милисекунди
        function executeHapticSystem(mode) {
            try {
                const triggerBlock = document.createElement('div');
                const uniqueId = 'haptix-' + Math.random().toString(36).substring(2);
                triggerBlock.innerHTML = `<input type="checkbox" id="${uniqueId}" switch><label for="${uniqueId}"></label>`;
                triggerBlock.setAttribute("style", "position:fixed; opacity:0; pointer-events:none; top:0; left:0;");
                document.body.appendChild(triggerBlock);
                const targetNode = triggerBlock.querySelector('label');

                if (mode === 'light') {
                    // Само еден брз, нативен и нежен системски импулс
                    targetNode.click();
                } 
                else if (mode === 'medium') {
                    // Среден: Два одалечени импулси со точно 35ms доцнење за да не се спојат
                    targetNode.click();
                    setTimeout(() => { targetNode.click(); }, 35);
                } 
                else if (mode === 'heavy') {
                    // Силно (Инстаграм Лајк): Три последователни микро-шокови на 22ms и 45ms.
                    // Ова го форсира куќиштето да направи брз троен однесувачки бран.
                    targetNode.click();
                    setTimeout(() => { targetNode.click(); }, 22);
                    setTimeout(() => { targetNode.click(); }, 45);
                }

                setTimeout(() => { triggerBlock.remove(); }, 200);
            } catch (e) { console.log(e); }
        }

        // Поврзување на иконите со соодветниот нов модулиран систем
        manualLikeTrigger.addEventListener('click', () => { executeHapticSystem('medium'); toggleLikeLogic(); });
        commentTrigger.addEventListener('click', () => { executeHapticSystem('light'); });

        // Double-Tap лајк систем на сликата со Heavy модулирана вибрација
        let lastTap = 0;
        document.querySelectorAll('.haptic-overlay').forEach(overlay => {
            overlay.addEventListener('click', () => {
                const now = Date.now();
                if (now - lastTap < 300) {
                    heartPop.classList.remove('animate-heart');
                    void heartPop.offsetWidth;
                    heartPop.classList.add('animate-heart');

                    executeHapticSystem('heavy'); // Форсирај го најсилниот троен хаптички бран на iPhone

                    if (!likedStates) { toggleLikeLogic(); }
                }
                lastTap = now;
            });
        });

        function toggleLikeLogic() {
            likedStates = !likedStates;
            if (likedStates) { heartBtn.innerText = '❤️'; likeCounts++; } 
            else { heartBtn.innerText = '🤍'; likeCounts--; }
            likesText.innerText = `${likeCounts.toLocaleString()} likes`;
        }

        document.addEventListener('gesturestart', e => e.preventDefault());
    </script>
</body>
</html>
